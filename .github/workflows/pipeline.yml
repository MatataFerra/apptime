name: "Pipeline"

on:
  push:
    branches:
      - develop

jobs:
  linter:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: "npm"
      - name: Install Yarn
        run: |
          npm install -g yarn
          yarn -v
      - name: Install dependencies
        run: yarn install
      - name: Run linter
        run: yarn lint

  test:
    needs:
      - linter
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: "npm"
      - name: Install Yarn
        run: |
          npm install -g yarn
          yarn -v
      - name: Install dependencies
        run: yarn install
      - name: Database installing
        run: yarn compose
      - name: Prisma config
        run: |
          npx prisma generate
          npx prisma migrate dev
          npx prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apptimedb
      - name: Running Test
        run: npm run test:ci
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apptimedb
