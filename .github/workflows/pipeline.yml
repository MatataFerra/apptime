name: "Pipeline"

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./pnpm-lock.yaml"
      - name: Install Pnpm
        run: |
          npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Database installing
        run: pnpm compose
      - name: Prisma config
        run: |
          npx prisma generate
          npx prisma migrate dev
          npx prisma db seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apptimedb
      - name: Running Test
        run: pnpm test:ci
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apptimedb
