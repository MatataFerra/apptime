name: "Pipeline"

on: 
  push:
    branches:
      - test

jobs:

  install:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-optional
      - uses: actions/upload-artifact@v3
        with:
          name: deps
          path: deps


  linter:
    needs: 
      - install
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: deps
          path: deps
      - name: Run linter
        run: npm run lint
      
      
  test:
    runs-on: ubuntu-20.04 
    needs:
      - install
      - prisma
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: deps
          path: deps
      - name: Run docker compose
        run: docker compose -f "docker-compose.yml" up -d --build --remove-orphans
      
      - name: npm run test:ci
        run: npm run test:ci
        env: 
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
  prisma:
    needs: install
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: deps
          path: deps
      - name: Prisma config
        run: npx prisma generate && npx prisma migrate dev && npx prisma db seed
        env: 
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
