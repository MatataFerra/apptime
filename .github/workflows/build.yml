name: "Build"

on:
  push:
    branches:
      - staging

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./pnpm-lock.yaml"
      - name: Install Pnpm
        run: |
          npm install -g pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build app
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
